<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>合成大兔头</title>

  <link href="style/main.css" rel="stylesheet" type="text/css">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png">
  <link rel="apple-touch-startup-image" href="meta/apple-touch-startup-image-640x1096.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)"> <!-- iPhone 5+ -->
  <link rel="apple-touch-startup-image" href="meta/apple-touch-startup-image-640x920.png"  media="(device-width: 320px) and (device-height: 480px) and (-webkit-device-pixel-ratio: 2)"> <!-- iPhone, retina -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <meta name="HandheldFriendly" content="True">
  <meta name="MobileOptimized" content="320">
  <meta name="viewport" content="width=device-width, target-densitydpi=160dpi, initial-scale=1.0, maximum-scale=1, user-scalable=no, minimal-ui">
</head>
<body>
  <div class="container">
    <div class="heading">
      <h1 class="title">2048</h1>
      <div class="scores-container">
        <div class="score-container">0</div>
        <div class="best-container">0</div>
      </div>
    </div>

    <div class="above-game">
      <div id="night" style="padding:10px;">
      </div>
      <p class="game-intro"></p>
      <a class="restart-button"></a>
      <a class="undo-button"></a>      
    </div>

    <div class="game-container">
      <div class="game-message">
        <p></p>
        <div class="lower">
	        <a class="keep-playing-button"></a>
          <a class="retry-button"></a>
          <a class="confirm-button"></a>
          <a class="undo-move-button"></a>          
          <a class="cancel-button"></a>
        </div>
      </div>

      <div class="grid-container"></div>

      <div class="tile-container">

      </div>
    </div>

  </div>

  <script type="module">
    import { start_game, i18n } from './_build/js/release/build/2048.js';
    const size = 4;
    const gridContainer = document.querySelector('.grid-container');
    for (let i = 0; i < size; i++) {
      const row = document.createElement('div');
      row.classList.add('grid-row');
      for (let j = 0; j < size; j++) {
        const cell = document.createElement('div');
        cell.classList.add('grid-cell');
        row.appendChild(cell);
      }
      gridContainer.appendChild(row);
    }
    start_game(size, 2048);
    function renderI18n(className, key) {
      const elements = document.getElementsByClassName(className);
      for (let element of elements) {
        element.innerHTML = i18n(key);
      }
    }
    renderI18n('game-intro', 'intro');
    renderI18n('restart-button', 'new_game');
    renderI18n('undo-button', 'undo');
    renderI18n('keep-playing-button', 'keep_going');
    renderI18n('retry-button', 'try_again');
    renderI18n('confirm-button', 'ok');
    renderI18n('undo-move-button', 'undo');
    renderI18n('cancel-button', 'cancel');
  </script>
</body>
</html>
